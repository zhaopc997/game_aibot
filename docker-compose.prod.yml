# ═══════════════════════════════════════════════════════════════
# 生产环境编排
#
# 用法：
#   cp .env.production.example .env.production   # 填入真实密钥
#   docker compose -p gameaibot -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# 端口策略：生产仅暴露前端 80（由 Nginx 统一入口，/api 反代到后端）。
# 数据库、Redis、ES、MinIO **不对宿主机暴露端口**，仅容器网络内可达，
# 避免依赖服务直接暴露到公网。
# 如需本机调试，临时注释掉对应端口映射即可。
# ═══════════════════════════════════════════════════════════════

services:
  # ────────── 数据层 ──────────
  postgres:
    image: postgres:16-alpine
    container_name: game-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-guide_platform}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # 性能与稳定性
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-guide_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [prodx]
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: game-prod-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - prod-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [prodx]
    deploy:
      resources:
        limits:
          memory: 768M

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: game-prod-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=${ES_SECURITY_ENABLED:-false}
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - prod-esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [prodx]
    deploy:
      resources:
        limits:
          memory: 2G

  minio:
    image: minio/minio:latest
    container_name: game-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - prod-miniodata:/data
    networks: [prodx]
    deploy:
      resources:
        limits:
          memory: 1G

  # ────────── 应用层 ──────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: game-platform-backend:latest
    container_name: game-prod-backend
    restart: unless-stopped
    depends_on:
      postgres:    { condition: service_healthy }
      redis:       { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-guide_platform}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ES_URIS: http://elasticsearch:9200
      # 敏感项无默认值 —— 未在 .env.production 中提供则启动失败
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      UPLOAD_DIR: /data/uploads
      LOG_FILE: /data/logs/app.log
      TZ: Asia/Shanghai
    volumes:
      - prod-uploads:/data/uploads
      - prod-logs:/data/logs
    networks: [prodx]
    deploy:
      resources:
        limits:
          memory: 1.5G
    # 停机给足时间（配合应用内30s 优雅停机）
    stop_grace_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: game-platform-frontend:latest
    container_name: game-prod-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [prodx]
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  prodx:
    driver: bridge

volumes:
  prod-pgdata:
  prod-redisdata:
  prod-esdata:
  prod-miniodata:
  prod-uploads:
  prod-logs: