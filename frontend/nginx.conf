# ═══════════════════════════════════════════════════════════════
# 前端 Nginx 配置
#   - 托管 React 静态产物
#   - SPA history fallback（直接访问 /games/2 也能命中前端路由）
#   - /api 与 /ws 反向代理到后端容器（实现同域，浏览器无需 CORS）
# ═══════════════════════════════════════════════════════════════

# ───── 后端地址：必须运行时解析，不能用 upstream 块 ─────
#
# 踩过的坑：原来写的是
#     upstream backend { server backend:8080; keepalive 32; }
# Nginx 只在**启动时**解析一次这个域名并永久缓存 IP。
# 后端容器一旦重建（改配置、换镜像、调内存限制都会重建），
# Docker 会给它分配新的 IP，而 nginx 仍死盯旧 IP —— 于是所有
# /api 请求持续 502，直到前端容器也被重启。
#
# 实测事故：调整后端内存限制重建容器后，API 中断约 6 小时才被发现。
#
# 现在改为 proxy_pass 使用变量 + Docker 内嵌 DNS（127.0.0.11），
# nginx 会在变量求值时重新解析，最长 10 秒内自动跟上新 IP。
# 代价是失去 upstream 的 keepalive 连接池，这里可以接受 ——
# 后端在同一台机器上，建连开销远小于一次全站 API 中断。
resolver 127.0.0.11 valid=10s ipv6=off;

# 真实客户端 IP：优先透传 Caddy 写入的 X-Real-IP。
# 原来的 add_header 写的是 $remote_addr，会把真实 IP 覆盖成上一层代理的地址
# （在本项目的链路里就是 Docker 网关），导致后端限流把所有人算成同一个用户。
map $http_x_real_ip $real_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;

    # 注意：set 只能写在 server / location / if 上下文，
    # 放到 http 层会导致 nginx 启动失败（"[emerg] set directive is not allowed here"）。
    set $backend_upstream "http://backend:8080";

    # 注意：set 只能写在 server / location / if 上下文，
    # 放到 http 层会导致 nginx 启动失败（"[emerg] set directive is not allowed here"）。
    set $backend_upstream "http://backend:8080";

    root /usr/share/nginx/html;
    index index.html;

    # ───── 安全响应头 ─────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 允许自身 favicon 与内联样式（Tailwind 运行时不需要，但保险）
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self' data:;" always;

    client_max_body_size 12m;

    # ───── 压缩 ─────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        image/svg+xml application/font-woff;

    # ───── 静态资源长缓存（文件名带内容 hash，可永久缓存）─────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|avif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # ───── 容器健康检查端点 ─────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ───── API 反向代理 ─────
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $real_client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # AI 生成等长耗时接口，超时放宽
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
        client_max_body_size 12m;
    }

    # OAuth2 回调
    location /oauth2/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 上传文件访问
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_read_timeout 60s;
    }

    # ───── WebSocket ─────
    location /ws {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $real_client_ip;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ───── 路由与静态目录撞名的例外 ─────
    # /games 是前端路由（GameListPage），但 public/games/ 是同名静态资源目录
    # （存放各游戏图标，如 /games/pixel_city/cover.svg）。
    # nginx 默认把 /games 当目录做「补斜杠」301，且跳转地址用的是内部 http://，
    # 落地到 /games/ 后又因目录无 index 返回 403 —— 用户直接访问或刷新游戏
    # 列表页会白屏（站内点击跳转因为是客户端路由不受影响，所以很隐蔽）。
    # 用精确匹配把这两个路径交还给 SPA；/games/xxx 资源仍走下面的静态规则。
    location = /games {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /games/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ───── SPA fallback ─────
    # 关键：React Router 用 history 模式，直接访问 /games/2 时
    # Nginx 找不到该文件，必须回退到 index.html 交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
