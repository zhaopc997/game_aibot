# ═══════════════════════════════════════════════════════════════
# 前端 Nginx 配置
#   - 托管 React 静态产物
#   - SPA history fallback（直接访问 /games/2 也能命中前端路由）
#   - /api 与 /ws 反向代理到后端容器（实现同域，浏览器无需 CORS）
# ═══════════════════════════════════════════════════════════════

# 上游后端
upstream backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ───── 安全响应头 ─────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 允许自身 favicon 与内联样式（Tailwind 运行时不需要，但保险）
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self' data:;" always;

    client_max_body_size 12m;

    # ───── 压缩 ─────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        image/svg+xml application/font-woff;

    # ───── 静态资源长缓存（文件名带内容 hash，可永久缓存）─────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|avif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # ───── 容器健康检查端点 ─────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ───── API 反向代理 ─────
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # AI 生成等长耗时接口，超时放宽
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
        client_max_body_size 12m;
    }

    # OAuth2 回调
    location /oauth2/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 上传文件访问
    location /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # ───── WebSocket ─────
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ───── SPA fallback ─────
    # 关键：React Router 用 history 模式，直接访问 /games/2 时
    # Nginx 找不到该文件，必须回退到 index.html 交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}