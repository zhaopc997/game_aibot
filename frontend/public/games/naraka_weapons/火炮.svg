<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="wbg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#7c2d12" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="wgold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>
    <filter id="wshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="256" height="256" rx="40" fill="url(#wbg)" />
  <rect width="250" height="250" x="3" y="3" rx="37" fill="none" stroke="url(#wgold)" stroke-width="2" opacity="0.6" />

  <!-- Blades / Crosshairs decorative background -->
  <circle cx="128" cy="112" r="70" fill="none" stroke="#fdba74" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
  <circle cx="128" cy="112" r="54" fill="#000000" fill-opacity="0.3" stroke="url(#wgold)" stroke-width="1.5" />

  <!-- Weapon Icon & Calligraphy -->
  <text x="128" y="118" font-size="54" text-anchor="middle" filter="url(#wshadow)">💣</text>
  <text x="128" y="152" font-family="'PingFang SC', 'Noto Serif SC', serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" filter="url(#wshadow)">火炮</text>

  <!-- Weapon Type Badge -->
  <g transform="translate(128, 38)">
    <rect x="-60" y="-12" width="120" height="20" rx="10" fill="#000000" fill-opacity="0.7" stroke="#fdba74" stroke-width="1" />
    <text x="0" y="2" font-family="'PingFang SC', sans-serif" font-weight="bold" font-size="10" fill="#fdba74" text-anchor="middle">远程</text>
  </g>

  <!-- Bottom Plate -->
  <g transform="translate(128, 218)">
    <rect x="-70" y="-18" width="140" height="28" rx="8" fill="#0c0a09" fill-opacity="0.9" stroke="url(#wgold)" stroke-width="1" />
    <text x="0" y="-2" font-family="'PingFang SC', sans-serif" font-weight="bold" font-size="11" fill="#fef08a" text-anchor="middle">远程 · 范围轰炸反弹</text>
    <text x="0" y="8" font-family="sans-serif" font-weight="500" font-size="8" fill="#a8a29e" text-anchor="middle">Cannon</text>
  </g>
</svg>