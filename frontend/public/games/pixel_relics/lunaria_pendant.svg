  <text x="100" y="162" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">月神吊坠</text>
  <text x="100" y="186" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="9" fill="#f5d0fe" text-anchor="middle">受击偷取怒气</text>
