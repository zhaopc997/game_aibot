      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="relic_glow_lunaria_pendant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe" />
