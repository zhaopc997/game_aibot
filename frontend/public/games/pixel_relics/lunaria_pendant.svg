  <rect width="200" height="200" rx="14" fill="url(#relic_bg_lunaria_pendant)" />
  <rect x="8" y="8" width="184" height="184" rx="10" fill="none" stroke="url(#relic_glow_lunaria_pendant)" stroke-width="3.5" />
  
